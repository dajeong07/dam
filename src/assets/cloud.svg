<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <!-- 생각 말풍선: 동그라미 여러 개를 겹쳐 구름을 만들고, 아래로 작은 동그라미 2개를 이어 붙임 -->

  <!-- 1단계: 동그라미들을 굵은 테두리로 먼저 그림 -->
  <g fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3">
    <circle cx="120" cy="58" r="48"/>
    <circle cx="75" cy="52" r="38"/>
    <circle cx="165" cy="50" r="40"/>
    <circle cx="42" cy="72" r="30"/>
    <circle cx="198" cy="72" r="32"/>
    <circle cx="90" cy="85" r="30"/>
    <circle cx="150" cy="86" r="30"/>
  </g>

  <!-- 2단계: 같은 동그라미를 테두리 없이 흰색으로 덮어서, 겹친 안쪽 선을 지우고 바깥 선만 남김 -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="58" r="48"/>
    <circle cx="75" cy="52" r="38"/>
    <circle cx="165" cy="50" r="40"/>
    <circle cx="42" cy="72" r="30"/>
    <circle cx="198" cy="72" r="32"/>
    <circle cx="90" cy="85" r="30"/>
    <circle cx="150" cy="86" r="30"/>
    <ellipse cx="120" cy="70" rx="90" ry="34"/>
  </g>

  <!-- 생각 방울: 구름에서 담이 쪽으로 작아지며 내려옴 -->
  <g fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5">
    <circle cx="108" cy="128" r="8"/>
    <circle cx="100" cy="143" r="5"/>
  </g>
</svg>
